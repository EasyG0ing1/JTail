
name: Bug Report
description: Report something that is not working as expected.
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, please check existing issues and discussions.

        Do not include authentication keys, private keys, passwords,
        or other sensitive information in your report.

  - type: textarea
    id: summary
    attributes:
      label: Problem Description
      description: Describe the problem clearly.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Provide the steps or code necessary to reproduce the problem.
      placeholder: |
        1. Configure JTail using...
        2. Call...
        3. Observe...
      render: java
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect JTail to do?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
    validations:
      required: true

  - type: dropdown
    id: control_server
    attributes:
      label: Control Server
      options:
        - Tailscale
        - Headscale
        - Other
        - Not applicable
    validations:
      required: true

  - type: input
    id: jtail_version
    attributes:
      label: JTail Version
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: dropdown
    id: java_version
    attributes:
      label: Java Version
      options:
        - Java 21
        - Java 22
        - Java 23
        - Java 24
        - Java 25
        - Java 26
        - Other
    validations:
      required: true

  - type: dropdown
    id: operating_system
    attributes:
      label: Operating System
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Exceptions
      description: Include relevant stack traces and log output. Remove sensitive information.
      render: text
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Anything else that might help diagnose the problem.
    validations:
      required: false
